services:
  product-service-postgresql-db:
    image: docker.io/library/postgres:18-alpine
    container_name: product-service-postgresql-db
    restart: always
    environment:
      POSTGRES_USER: ${PRODUCT_DB_USERNAME:-product-service}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:-product-service}
      POSTGRES_DB: ${PRODUCT_DB_NAME:-product_db}
    ports:
      - "7001:5432"

  order-service-postgresql-db:
    image: docker.io/library/postgres:18-alpine
    container_name: order-service-postgresql-db
    restart: always
    environment:
      POSTGRES_USER: ${ORDER_DB_USERNAME:-order-service}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order-service}
      POSTGRES_DB: ${ORDER_DB_NAME:-order_db}
    ports:
      - "7002:5432"

  order-inventory-kafka:
    image: docker.io/apache/kafka:4.2.0
    container_name: order-inventory-kafka
    ports:
      - "7003:7003"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@order-inventory-kafka:9093
      - KAFKA_LISTENERS=INTERNAL://:9092,EXTERNAL://:7003,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://order-inventory-kafka:9092,EXTERNAL://localhost:7003
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - CLUSTER_ID=5L6g3nShT-eMCtK--X86sw

  inventory-service-postgresql-db:
    image: docker.io/library/postgres:18-alpine
    container_name: inventory-service-postgresql-db
    restart: always
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USERNAME:-inventory-service}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory-service}
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory_db}
    ports:
      - "7004:5432"

  inventory-service-redis:
    image: docker.io/library/redis:8.6.0-alpine
    container_name: inventory-service-redis
    restart: always
    ports:
      - "7005:6379"
    command: redis-server --requirepass ${INVENTORY_REDIS_PASSWORD:-inventory-service} --appendonly yes

  auth-service-redis:
    image: docker.io/library/redis:8.6.0-alpine
    container_name: auth-service-redis
    restart: always
    ports:
      - "7006:6379"
    command: redis-server --requirepass ${AUTH_REDIS_PASSWORD:-auth-service} --appendonly yes

  auth-service-postgresql-db:
    image: docker.io/library/postgres:18-alpine
    container_name: auth-service-postgresql-db
    restart: always
    environment:
      POSTGRES_USER: ${AUTH_DB_USERNAME:-auth-service}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth-service}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    ports:
      - "7007:5432"
