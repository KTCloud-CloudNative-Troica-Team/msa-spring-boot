spring:
  application:
    name: inventory-service

  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:7004/inventory_db}
    username: ${INVENTORY_DB_USERNAME:inventory-service}
    password: ${INVENTORY_DB_PASSWORD:inventory-service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    generate-ddl: false
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${INVENTORY_REDIS_HOST:localhost}
      port: ${INVENTORY_REDIS_PORT:7005}
      password: ${INVENTORY_REDIS_PASSWORD:inventory-service}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:7003}

    consumer:
      group-id: inventory-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    topic:
      inventory-reserved-result: inventory-reserved-result-topic
      inventory-reserve-request: inventory-reserve-request-topic
      inventory-reserve-request-dlt: inventory-reserve-request-dlt
      inventory-reserved-result-dlt: inventory-reserved-result-dlt
      inventory-release-request: inventory-release-request-topic
      inventory-release-request-dlt: inventory-release-request-dlt

server:
  port: ${SERVER_PORT:8003}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9003}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics,prometheus
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
