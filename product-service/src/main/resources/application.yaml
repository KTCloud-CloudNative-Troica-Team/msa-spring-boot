spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:postgresql://localhost:7001/product_db}
    username: ${PRODUCT_DB_USERNAME:product-service}
    password: ${PRODUCT_DB_PASSWORD:product-service}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    generate-ddl: false
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration


server:
  port: ${SERVER_PORT:8001}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9001}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics,prometheus
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
