name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate proto stubs
        run: ./gradlew generateProto

      - name: Compile
        run: ./gradlew compileKotlin compileTestKotlin

      - name: Test
        run: ./gradlew test

  image:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - product-service
          - order-service
          - inventory-service
          - auth-service
          - user-api-gateway
          - admin-api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: market/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.service }}
