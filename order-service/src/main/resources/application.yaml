spring:
  application:
    name: order-service

  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:7002/order_db}
    username: ${ORDER_DB_USERNAME:order-service}
    password: ${ORDER_DB_PASSWORD:order-service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    generate-ddl: false
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${ORDER_REDIS_HOST:localhost}
      port: ${ORDER_REDIS_PORT:7005}
      password: ${ORDER_REDIS_PASSWORD:inventory-service}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:7003}

    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    topic:
      inventory-reserved-result: inventory-reserved-result-topic
      inventory-reserve-request: inventory-reserve-request-topic
      inventory-reserve-request-dlt: inventory-reserve-request-dlt
      inventory-reserved-result-dlt: inventory-reserved-result-dlt
      inventory-release-request: inventory-release-request-topic

order:
  outbox:
    relay:
      fixed-delay-ms: ${ORDER_OUTBOX_RELAY_FIXED_DELAY_MS:5000}

server:
  port: ${SERVER_PORT:8002}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9002}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics,prometheus
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
