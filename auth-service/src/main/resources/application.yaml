spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:7007/auth_db}
    username: ${AUTH_DB_USERNAME:auth-service}
    password: ${AUTH_DB_PASSWORD:auth-service}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    generate-ddl: false
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${AUTH_REDIS_HOST:localhost}
      port: ${AUTH_REDIS_PORT:7006}
      password: ${AUTH_REDIS_PASSWORD:auth-service}

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-32chars-min-secret-key}

server:
  port: ${SERVER_PORT:8005}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9005}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics,prometheus
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
